<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de endereços · Busca de CEP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Cadastre endereços pelo CEP</h1>
    <p>Digite o CEP, confira o endereço encontrado e salve. Cada cadastro vira uma etiqueta de envio.</p>
  </header>

  <main>
    <section class="cartao" aria-labelledby="titulo-form">
      <h2 id="titulo-form">Novo cadastro</h2>
      <form id="formulario" novalidate>
        <label for="nome">Nome do destinatário
          <input type="text" id="nome" required minlength="3" placeholder="Maria da Silva" autocomplete="name">
        </label>

        <label for="cep">CEP
          <span class="linha-cep">
            <input type="text" id="cep" required pattern="[0-9]{5}-?[0-9]{3}" inputmode="numeric"
                   maxlength="9" placeholder="13184-000" autocomplete="postal-code">
            <button type="button" id="btnBuscar">
              <span class="spinner" aria-hidden="true"></span>
              <span id="textoBotao">Buscar CEP</span>
            </button>
          </span>
        </label>

        <div id="mensagem" role="status" aria-live="polite"></div>

        <label for="rua">Rua <input type="text" id="rua" required readonly></label>
        <label for="bairro">Bairro <input type="text" id="bairro" readonly></label>
        <div class="duas">
          <label for="cidade">Cidade <input type="text" id="cidade" required readonly></label>
          <label for="uf">UF <input type="text" id="uf" required readonly></label>
        </div>
        <label for="numero">Número
          <input type="text" id="numero" required placeholder="120" autocomplete="off">
        </label>

        <button type="submit" class="salvar">Salvar endereço</button>
      </form>
    </section>

    <section aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Endereços cadastrados <span id="contador">(0)</span></h2>
      <p id="vazio" class="vazio">Nenhum endereço salvo ainda. Busque um CEP e salve o primeiro.</p>
      <div id="lista" class="lista"></div>
    </section>
  </main>

  <footer>Desenvolvimento de Websites · 4º Bimestre · Semana 2 · Dados: ViaCEP</footer>

  <script src="script.js"></script>
</body>
</html>
